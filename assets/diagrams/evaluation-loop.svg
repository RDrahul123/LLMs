<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Continuous LLM evaluation loop</title><desc id="desc">User needs and risks define a versioned dataset. A versioned system is run, quality, safety, latency, and cost are measured, failures analyzed, improvements made, and release gates checked before staged rollout.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1000" height="390" rx="24" fill="#f6f8fc"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Evaluation: a feedback loop with a release gate</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="52" y="115" width="180" height="80" rx="14" fill="#e5edff" stroke="#7395ef"/><text x="142" y="149" font-size="16" font-weight="700" fill="#173b8f">Curated dataset</text><text x="142" y="173" font-size="12" fill="#43546c">representative + versioned</text><rect x="292" y="115" width="180" height="80" rx="14" fill="#eee9ff" stroke="#9c82e8"/><text x="382" y="149" font-size="16" font-weight="700" fill="#5232a3">Run system</text><text x="382" y="173" font-size="12" fill="#43546c">prompt/model/index/code</text><rect x="532" y="115" width="180" height="80" rx="14" fill="#fff2dc" stroke="#e3a748"/><text x="622" y="149" font-size="16" font-weight="700" fill="#8a5310">Measure</text><text x="622" y="173" font-size="12" fill="#43546c">quality · safety · cost</text><rect x="772" y="115" width="180" height="80" rx="14" fill="#e7f7f1" stroke="#54ae88"/><text x="862" y="149" font-size="16" font-weight="700" fill="#146445">Analyze failures</text><text x="862" y="173" font-size="12" fill="#43546c">slices + examples</text></g>
  <path d="M235 155h50M475 155h50M715 155h50" stroke="#53657d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M862 199v90H382v-88" fill="none" stroke="#53657d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="615" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#43546c">improve one cause at a time; re-run regression suite</text>
  <path d="M622 198v108" stroke="#53657d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="515" y="310" width="215" height="52" rx="14" fill="#ffe8e8" stroke="#e17e83"/><text x="622" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#9b3037">Release gates pass?</text><text x="622" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#43546c">if yes: canary + monitor</text>
</svg>
