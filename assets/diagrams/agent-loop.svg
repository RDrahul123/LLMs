<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">A controlled tool-using agent loop</title><desc id="desc">The controller sends a goal and tools to the model; the model proposes an action; the controller validates, authorizes, and bounds the action before execution; results return as observations, and the loop ends under explicit stop conditions.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1000" height="420" rx="24" fill="#f6f8fc"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Agent = model proposals + a bounded controller</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="140" width="170" height="92" rx="16" fill="#e5edff" stroke="#7395ef" stroke-width="2"/><text x="140" y="177" font-size="18" font-weight="700" fill="#173b8f">Controller</text><text x="140" y="201" font-size="13" fill="#43546c">state + limits + policy</text><rect x="310" y="140" width="170" height="92" rx="16" fill="#eee9ff" stroke="#9c82e8" stroke-width="2"/><text x="395" y="177" font-size="18" font-weight="700" fill="#5232a3">LLM</text><text x="395" y="201" font-size="13" fill="#43546c">proposes next step</text><rect x="565" y="140" width="170" height="92" rx="16" fill="#fff2dc" stroke="#e3a748" stroke-width="2"/><text x="650" y="177" font-size="18" font-weight="700" fill="#8a5310">Guard checks</text><text x="650" y="201" font-size="13" fill="#43546c">schema + permission</text><rect x="820" y="140" width="135" height="92" rx="16" fill="#e7f7f1" stroke="#54ae88" stroke-width="2"/><text x="887" y="177" font-size="18" font-weight="700" fill="#146445">Tool</text><text x="887" y="201" font-size="13" fill="#43546c">limited capability</text></g>
  <path d="M228 168h75" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/><text x="265" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#66758a">goal + tools</text>
  <path d="M483 168h75" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/><text x="520" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#66758a">action proposal</text>
  <path d="M738 168h75" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/><text x="776" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#66758a">authorized call</text>
  <path d="M887 237v76H140v-76" fill="none" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/><text x="510" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#43546c">tool result becomes an observation; repeat only within explicit budgets</text>
  <rect x="295" y="344" width="430" height="44" rx="14" fill="#ffe8e8" stroke="#e17e83"/><text x="510" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9b3037">Stop: answer · denied · timeout · step/tool/cost limit</text>
</svg>
