<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Production LLM service architecture</title><desc id="desc">A client passes authentication, authorization and quotas at a gateway, then an application service checks cache and retrieval, routes requests to a provider, returns a validated response and emits privacy-aware telemetry.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1100" height="400" rx="24" fill="#f6f8fc"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">A production request crosses several controlled boundaries</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="130" width="125" height="80" rx="14" fill="#e5edff" stroke="#7395ef"/><text x="97" y="164" font-size="16" font-weight="700" fill="#173b8f">Client</text><text x="97" y="187" font-size="12" fill="#43546c">user interface</text><rect x="205" y="130" width="180" height="80" rx="14" fill="#fff2dc" stroke="#e3a748"/><text x="295" y="162" font-size="16" font-weight="700" fill="#8a5310">Gateway</text><text x="295" y="185" font-size="12" fill="#43546c">auth · quota · validate</text><rect x="430" y="130" width="185" height="80" rx="14" fill="#eee9ff" stroke="#9c82e8"/><text x="522" y="162" font-size="16" font-weight="700" fill="#5232a3">App service</text><text x="522" y="185" font-size="12" fill="#43546c">policy · tools · API</text><rect x="660" y="70" width="160" height="68" rx="14" fill="#e7f7f1" stroke="#54ae88"/><text x="740" y="99" font-size="15" font-weight="700" fill="#146445">Cache / retrieval</text><text x="740" y="119" font-size="11" fill="#43546c">bounded + access-aware</text><rect x="660" y="170" width="160" height="68" rx="14" fill="#e5edff" stroke="#7395ef"/><text x="740" y="199" font-size="15" font-weight="700" fill="#173b8f">Model router</text><text x="740" y="219" font-size="11" fill="#43546c">timeout · fallback · budget</text><rect x="865" y="130" width="195" height="80" rx="14" fill="#ffe8e8" stroke="#e17e83"/><text x="962" y="162" font-size="16" font-weight="700" fill="#9b3037">Provider / model</text><text x="962" y="185" font-size="12" fill="#43546c">external dependency</text></g>
  <path d="M162 170h38M387 170h38M617 170h35M822 204h37" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/><path d="M522 127v-23h130" fill="none" stroke="#53657d" stroke-width="2.5" marker-end="url(#arr)"/><path d="M740 141v24" stroke="#53657d" stroke-width="2.5" marker-end="url(#arr)"/><path d="M962 215v75H522v-75" fill="none" stroke="#53657d" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <rect x="337" y="315" width="430" height="48" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#43546c">Telemetry: latency · tokens · errors · request IDs (minimize content)</text>
  <path d="M522 212v98" stroke="#53657d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
</svg>
