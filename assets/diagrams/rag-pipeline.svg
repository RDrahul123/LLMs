<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Two-path RAG pipeline</title><desc id="desc">Documents are parsed, chunked, embedded, and indexed ahead of time. A user query is embedded, matched to retrieved chunks, assembled with provenance, used to generate a grounded answer, and then citations are checked.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1200" height="430" rx="24" fill="#f6f8fc"/><text x="40" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">RAG: prepare evidence once, retrieve relevant evidence per question</text>
  <text x="42" y="89" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#66758a">INGEST / INDEX</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="107" width="155" height="70" rx="13" fill="#e5edff" stroke="#7395ef"/><text x="117" y="137" font-size="16" font-weight="700" fill="#173b8f">Documents</text><text x="117" y="158" font-size="12" fill="#43546c">PDF · HTML · text</text><rect x="245" y="107" width="155" height="70" rx="13" fill="#fff2dc" stroke="#e3a748"/><text x="322" y="137" font-size="16" font-weight="700" fill="#8a5310">Parse + chunk</text><text x="322" y="158" font-size="12" fill="#43546c">keep source metadata</text><rect x="450" y="107" width="155" height="70" rx="13" fill="#eee9ff" stroke="#9c82e8"/><text x="527" y="137" font-size="16" font-weight="700" fill="#5232a3">Embed chunks</text><text x="527" y="158" font-size="12" fill="#43546c">shared vector space</text><rect x="655" y="107" width="190" height="70" rx="13" fill="#e7f7f1" stroke="#54ae88"/><text x="750" y="137" font-size="16" font-weight="700" fill="#146445">Searchable index</text><text x="750" y="158" font-size="12" fill="#43546c">vectors + text + ACL metadata</text></g>
  <path d="M197 142h42M402 142h42M607 142h42" stroke="#53657d" stroke-width="3" marker-end="url(#ar)"/><path d="M750 180v74" stroke="#54ae88" stroke-width="3" marker-end="url(#ar)"/>
  <text x="42" y="280" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#66758a">QUERY / ANSWER</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="299" width="155" height="72" rx="13" fill="#fff2dc" stroke="#e3a748"/><text x="117" y="330" font-size="16" font-weight="700" fill="#8a5310">Question</text><text x="117" y="352" font-size="12" fill="#43546c">user intent</text><rect x="245" y="299" width="155" height="72" rx="13" fill="#eee9ff" stroke="#9c82e8"/><text x="322" y="330" font-size="16" font-weight="700" fill="#5232a3">Retrieve</text><text x="322" y="352" font-size="12" fill="#43546c">search + filter + rank</text><rect x="450" y="299" width="155" height="72" rx="13" fill="#e5edff" stroke="#7395ef"/><text x="527" y="330" font-size="16" font-weight="700" fill="#173b8f">Assemble context</text><text x="527" y="352" font-size="12" fill="#43546c">chunks with source IDs</text><rect x="655" y="299" width="155" height="72" rx="13" fill="#e7f7f1" stroke="#54ae88"/><text x="732" y="330" font-size="16" font-weight="700" fill="#146445">Generate</text><text x="732" y="352" font-size="12" fill="#43546c">answer from evidence</text><rect x="860" y="299" width="155" height="72" rx="13" fill="#ffe8e8" stroke="#e17e83"/><text x="937" y="330" font-size="16" font-weight="700" fill="#9b3037">Verify</text><text x="937" y="352" font-size="12" fill="#43546c">claims + citations</text></g>
  <path d="M197 335h42M402 335h42M607 335h42M812 335h42" stroke="#53657d" stroke-width="3" marker-end="url(#ar)"/><text x="1050" y="322" font-family="Arial,sans-serif" font-size="13" fill="#43546c">If evidence is</text><text x="1050" y="343" font-family="Arial,sans-serif" font-size="13" fill="#43546c">missing: abstain</text><text x="40" y="408" font-family="Arial,sans-serif" font-size="12" fill="#66758a">Retrieval supplies candidate evidence; generation and citation validation remain separate quality checks.</text>
</svg>
