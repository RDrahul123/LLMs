<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Defense in depth for AI application safety</title><desc id="desc">Safety controls surround the model: data minimization and authorization at input, least-privilege tools, validation and policy checks before actions, human review for consequential actions, and audit plus incident response.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1000" height="410" rx="24" fill="#f6f8fc"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Safety is layered around the model, not delegated to it</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="45" y="145" width="135" height="86" rx="15" fill="#e5edff" stroke="#7395ef"/><text x="112" y="179" font-size="15" font-weight="700" fill="#173b8f">Input boundary</text><text x="112" y="202" font-size="11" fill="#43546c">minimize + classify</text><rect x="218" y="145" width="145" height="86" rx="15" fill="#fff2dc" stroke="#e3a748"/><text x="290" y="179" font-size="15" font-weight="700" fill="#8a5310">Authorization</text><text x="290" y="202" font-size="11" fill="#43546c">user + data scope</text><rect x="402" y="145" width="145" height="86" rx="15" fill="#eee9ff" stroke="#9c82e8"/><text x="474" y="179" font-size="15" font-weight="700" fill="#5232a3">LLM</text><text x="474" y="202" font-size="11" fill="#43546c">untrusted proposer</text><rect x="586" y="145" width="145" height="86" rx="15" fill="#e7f7f1" stroke="#54ae88"/><text x="658" y="179" font-size="15" font-weight="700" fill="#146445">Action guard</text><text x="658" y="202" font-size="11" fill="#43546c">validate + restrict</text><rect x="770" y="145" width="180" height="86" rx="15" fill="#ffe8e8" stroke="#e17e83"/><text x="860" y="179" font-size="15" font-weight="700" fill="#9b3037">Human / tool</text><text x="860" y="202" font-size="11" fill="#43546c">approve high-impact acts</text></g>
  <path d="M183 188h30M366 188h30M550 188h30M734 188h30" stroke="#53657d" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M860 239v67H112v-67" fill="none" stroke="#53657d" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)"/><rect x="288" y="292" width="400" height="50" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="488" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#43546c">Monitoring · audit trail · incident response · rollback</text>
</svg>
