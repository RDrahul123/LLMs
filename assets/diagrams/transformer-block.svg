<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Transformer block and causal attention</title>
  <desc id="desc">Token embeddings flow through normalization, masked multi-head attention with a residual, normalization, an MLP with another residual, then a language-model head. A lower triangular matrix illustrates causal visibility.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657d"/></marker></defs><rect width="1000" height="590" rx="24" fill="#f6f8fc"/>
  <text x="45" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b4d">Inside one decoder block</text>
  <rect x="72" y="82" width="540" height="55" rx="12" fill="#e5edff" stroke="#7395ef"/><text x="342" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#173b8f">Token embeddings + position information · [B,T,d]</text>
  <path d="M342 138v25" stroke="#53657d" stroke-width="3" marker-end="url(#a)"/><rect x="192" y="169" width="300" height="45" rx="12" fill="#fff2dc" stroke="#e3a748"/><text x="342" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#8a5310">Normalization</text>
  <path d="M342 215v22" stroke="#53657d" stroke-width="3" marker-end="url(#a)"/><rect x="132" y="243" width="420" height="66" rx="12" fill="#eee9ff" stroke="#9c82e8"/><text x="342" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#5232a3">Masked multi-head attention</text><text x="342" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#43546c">mixes information from permitted earlier positions</text>
  <path d="M342 310v20" stroke="#53657d" stroke-width="3" marker-end="url(#a)"/><rect x="192" y="336" width="300" height="44" rx="12" fill="#e7f7f1" stroke="#54ae88"/><text x="342" y="364" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#146445">Residual add: input + attention</text>
  <path d="M342 381v20" stroke="#53657d" stroke-width="3" marker-end="url(#a)"/><rect x="192" y="407" width="300" height="44" rx="12" fill="#fff2dc" stroke="#e3a748"/><text x="342" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#8a5310">Normalization → position-wise MLP</text>
  <path d="M342 452v20" stroke="#53657d" stroke-width="3" marker-end="url(#a)"/><rect x="192" y="478" width="300" height="44" rx="12" fill="#e7f7f1" stroke="#54ae88"/><text x="342" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#146445">Residual add → next block</text>
  <path d="M614 108h74v404h-190" fill="none" stroke="#7395ef" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="695" y="325" transform="rotate(90 695 325)" font-family="Arial,sans-serif" font-size="13" fill="#43546c">residual path preserves a direct signal</text>
  <text x="758" y="117" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172b4d">Causal visibility</text><text x="758" y="140" font-family="Arial,sans-serif" font-size="12" fill="#66758a">Rows query; columns are keys</text>
  <g transform="translate(760 163)"><rect x="0" y="0" width="40" height="40" fill="#4c76d9"/><rect x="40" y="0" width="40" height="40" fill="#e4e9f1"/><rect x="80" y="0" width="40" height="40" fill="#e4e9f1"/><rect x="120" y="0" width="40" height="40" fill="#e4e9f1"/><rect x="0" y="40" width="40" height="40" fill="#4c76d9"/><rect x="40" y="40" width="40" height="40" fill="#4c76d9"/><rect x="80" y="40" width="40" height="40" fill="#e4e9f1"/><rect x="120" y="40" width="40" height="40" fill="#e4e9f1"/><rect x="0" y="80" width="40" height="40" fill="#4c76d9"/><rect x="40" y="80" width="40" height="40" fill="#4c76d9"/><rect x="80" y="80" width="40" height="40" fill="#4c76d9"/><rect x="120" y="80" width="40" height="40" fill="#e4e9f1"/><rect x="0" y="120" width="40" height="40" fill="#4c76d9"/><rect x="40" y="120" width="40" height="40" fill="#4c76d9"/><rect x="80" y="120" width="40" height="40" fill="#4c76d9"/><rect x="120" y="120" width="40" height="40" fill="#4c76d9"/><g fill="#fff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle"><text x="20" y="24">1</text><text x="20" y="64">1</text><text x="60" y="64">2</text><text x="20" y="104">1</text><text x="60" y="104">2</text><text x="100" y="104">3</text><text x="20" y="144">1</text><text x="60" y="144">2</text><text x="100" y="144">3</text><text x="140" y="144">4</text></g></g>
  <rect x="760" y="355" width="18" height="18" rx="3" fill="#4c76d9"/><text x="788" y="369" font-family="Arial,sans-serif" font-size="12" fill="#43546c">visible</text><rect x="852" y="355" width="18" height="18" rx="3" fill="#e4e9f1"/><text x="880" y="369" font-family="Arial,sans-serif" font-size="12" fill="#43546c">future masked</text>
  <text x="758" y="420" font-family="Arial,sans-serif" font-size="13" fill="#43546c">The output head turns the final</text><text x="758" y="440" font-family="Arial,sans-serif" font-size="13" fill="#43546c">hidden state into vocabulary logits.</text>
</svg>
