name: Deploy course website

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "01-introduction/**"
      - "02-prompt-engineering/**"
      - "02-transformer-architecture/**"
      - "03-llm-apis/**"
      - "04-rag/**"
      - "05-fine-tuning/**"
      - "07-advanced-prompting/**"
      - "08-ai-agents/**"
      - "09-advanced-rag/**"
      - "10-evaluation/**"
      - "11-deployment/**"
      - "12-safety-ethics/**"
      - "assets/diagrams/**"
      - "projects/**"
      - "course_site/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-course.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: course_site/requirements.txt

      - name: Install site dependencies
        run: python -m pip install -r course_site/requirements.txt

      - name: Assemble course pages
        run: python course_site/prepare_docs.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .course-site-build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
