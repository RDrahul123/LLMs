name: ContextIQ tests

on:
  push:
    paths:
      - "projects/03-document-qa/**"
      - ".github/workflows/contextiq-tests.yml"
  pull_request:
    paths:
      - "projects/03-document-qa/**"
      - ".github/workflows/contextiq-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/03-document-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python evaluation.py
